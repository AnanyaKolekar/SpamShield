# render.yaml
# Render Blueprint configuration for SMS Shield Backend

services:
  - type: web
    name: sms-shield-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PYTHONPATH
        value: .
      - key: DRIFT_THRESHOLD
        value: "0.35"
      - key: DATABASE_URL
        sync: false
